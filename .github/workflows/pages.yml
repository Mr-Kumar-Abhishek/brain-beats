name: Deploy to GitHub Pages

on:
  push:
    branches:
      - master
      - main
      - doctor/master
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci || npm install

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Run Audio Engine Test Suite (TDD)
        run: npm test

      - name: Generate Service Worker Precache
        run: npm run build:sw

      - name: Build Jekyll Site
        env:
          JEKYLL_ENV: production
        run: bundle exec jekyll build

      - name: Sync Service Worker, Documentation & Bypass Jekyll Processing
        run: |
          npm run build:sw
          cp sw-generated.js _site/sw-generated.js || true
          cp README.md _site/README.md || true
          cp DEVELOPMENT.md _site/DEVELOPMENT.md || true
          cp TEST_REPORT.md _site/TEST_REPORT.md || true
          cp CONTRIBUTING.md _site/CONTRIBUTING.md || true
          cp cocomo-cost-estimate.md _site/cocomo-cost-estimate.md || true
          cp package.json _site/package.json || true
          cp .node-version _site/.node-version || true
          cp .nvmrc _site/.nvmrc || true
          cp netlify.toml _site/netlify.toml || true
          touch _site/.nojekyll

      - name: Deploy to gh-pages Branch
        uses: peaceiris/actions-gh-pages@v4
        if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/doctor/master'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          keep_files: false
          cname: brain-beats.in
          commit_message: "deploy(pages): update production web application build for ${{ github.sha }}\n\nPublish Jekyll production bundle, audio engine, and static PWA assets to gh-pages branch.\n- Source commit: ${{ github.sha }}\n- Automated deployment via GitHub Actions"

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
