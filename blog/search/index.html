---
layout: default
title: Brain Beats Blog Search
description: Search research articles and studies on frequencies and brainwave entrainment.
keywords: Brain beats blog search, binaural beats search, frequency search
---
<main class="text-center">


    <h1>{{ page.title }}</h1>
    <section>
            <!-- HTML search field -->
            <div id="search-container">
                <form>
                    <div class="form-group mb-3">
                        <input type="text" class="form-control" id="search-input" placeholder="Type your search here..." autofocus>
                    </div>
                </form>
                <ul id="results-container" class="list-group"></ul>
            </div>
                
            <!-- Grab search-script.js -->
            <script src="{{site.url}}/blog/js/search.js" type="text/javascript"></script>
                
            <!-- Configuration -->
            <script>
                SimpleJekyllSearch({
                    searchInput: document.getElementById('search-input'),
                    resultsContainer: document.getElementById('results-container'),
                    json: '{{site.url}}/blog/search.json',
                    searchResultTemplate: '<li class="list-group-item list-group-item-action flex-column align-items-start"><a class="d-flex w-100 justify-content-between" href="{url}"><h5 class="mb-1">{title}</h5></a><br><small><p>{discription}</p></small><br><span class="post-meta"><small>{date}</small></span></li>'
                })
            </script>
    </section>
</main>
